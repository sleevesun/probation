<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="8" fill="url(#bg2)"/>
  <rect x="40" y="40" width="560" height="280" rx="6" fill="rgba(255,255,255,0.12)"/>
  <!-- Flow nodes -->
  <rect x="100" y="90" width="120" height="44" rx="22" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <text x="160" y="117" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="600">目标设定</text>
  <rect x="260" y="90" width="120" height="44" rx="22" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <text x="320" y="117" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="600">过程跟踪</text>
  <rect x="420" y="90" width="120" height="44" rx="22" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <text x="480" y="117" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="600">评价审批</text>
  <!-- Arrows -->
  <line x1="220" y1="112" x2="260" y2="112" stroke="rgba(255,255,255,0.6)" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="380" y1="112" x2="420" y2="112" stroke="rgba(255,255,255,0.6)" stroke-width="2" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="rgba(255,255,255,0.6)"/>
    </marker>
  </defs>
  <!-- Bottom row -->
  <rect x="180" y="180" width="120" height="44" rx="22" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <text x="240" y="207" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="600">结果发布</text>
  <rect x="340" y="180" width="120" height="44" rx="22" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <text x="400" y="207" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="600">归档复盘</text>
  <line x1="300" y1="202" x2="340" y2="202" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  <text x="320" y="270" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Arial, sans-serif" font-size="14">试用期转正管理流程</text>
