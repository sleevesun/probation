<svg width="1680" height="760" viewBox="0 0 1680 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">试用期转正业务流程图</title>
  <desc id="desc">展示员工、直属上级、HRBP、审批人在试用期转正主流程中的协作关系。</desc>
  <defs>
    <style>
      .title { font: 700 30px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2937; }
      .subtitle { font: 400 16px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7280; }
      .label { font: 600 18px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2937; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 500 14px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7280; text-anchor: middle; dominant-baseline: middle; }
      .legend { font: 600 15px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2937; text-anchor: middle; dominant-baseline: middle; }
      .note { font: 500 15px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #92400e; text-anchor: middle; dominant-baseline: middle; }
      .zone { fill: #eef4ff; stroke: #c7d2fe; stroke-width: 1; }
      .employee { fill: #dbeafe; stroke: #4a9eed; stroke-width: 2; }
      .manager { fill: #ffedd5; stroke: #f59e0b; stroke-width: 2; }
      .hrbp { fill: #dcfce7; stroke: #22c55e; stroke-width: 2; }
      .approval { fill: #ede9fe; stroke: #8b5cf6; stroke-width: 2; }
      .warning { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.5; }
      .danger { fill: #fee2e2; stroke: #ef4444; stroke-width: 2; }
      .system { fill: #ecfeff; stroke: #06b6d4; stroke-width: 2; }
      .arrow { stroke: #374151; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dashed { stroke: #ef4444; stroke-width: 2.5; fill: none; stroke-dasharray: 9 7; stroke-linecap: round; }
      .arrow-note { stroke: #f59e0b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; stroke-linecap: round; }
    </style>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#374151" />
    </marker>
    <marker id="arrow-red" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ef4444" />
    </marker>
    <marker id="arrow-amber" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="24" y="110" width="1632" height="590" rx="18" class="zone" />
  <text x="40" y="48" class="title">试用期转正业务流程图</text>
  <text x="40" y="78" class="subtitle">主链路覆盖目标设定、正式评估、审批与结果发布，并标出上级阶段性反馈和异常结束分支。</text>

  <rect x="60" y="250" width="150" height="84" rx="16" class="employee" />
  <text x="135" y="285" class="label">员工</text>
  <text x="135" y="310" class="label">制定目标</text>

  <rect x="260" y="250" width="180" height="84" rx="16" class="manager" />
  <text x="350" y="285" class="label">直属上级</text>
  <text x="350" y="310" class="label">确认目标 / 退回</text>

  <rect x="480" y="250" width="180" height="84" rx="16" class="hrbp" />
  <text x="570" y="285" class="label">HRBP</text>
  <text x="570" y="310" class="label">开启试用期评价</text>

  <rect x="710" y="250" width="150" height="84" rx="16" class="employee" />
  <text x="785" y="285" class="label">员工</text>
  <text x="785" y="310" class="label">填写自评</text>

  <rect x="910" y="250" width="180" height="84" rx="16" class="manager" />
  <text x="1000" y="285" class="label">直属上级</text>
  <text x="1000" y="310" class="label">评价 + 转正建议</text>

  <rect x="1140" y="250" width="180" height="84" rx="16" class="hrbp" />
  <text x="1230" y="285" class="label">HRBP</text>
  <text x="1230" y="310" class="label">发起转正审批</text>

  <rect x="1370" y="250" width="150" height="84" rx="16" class="approval" />
  <text x="1445" y="285" class="label">审批人</text>
  <text x="1445" y="310" class="label">审批</text>

  <rect x="1500" y="420" width="150" height="84" rx="16" class="system" />
  <text x="1575" y="455" class="label">系统</text>
  <text x="1575" y="480" class="label">自动发布结果</text>

  <rect x="1370" y="580" width="150" height="84" rx="16" class="employee" />
  <text x="1445" y="615" class="label">员工</text>
  <text x="1445" y="640" class="label">查看结果</text>

  <path d="M210 292 H260" class="arrow" marker-end="url(#arrow)" />
  <path d="M440 292 H480" class="arrow" marker-end="url(#arrow)" />
  <path d="M660 292 H710" class="arrow" marker-end="url(#arrow)" />
  <path d="M860 292 H910" class="arrow" marker-end="url(#arrow)" />
  <path d="M1090 292 H1140" class="arrow" marker-end="url(#arrow)" />
  <path d="M1320 292 H1370" class="arrow" marker-end="url(#arrow)" />
  <path d="M1445 334 V376 H1575 V420" class="arrow" marker-end="url(#arrow)" />
  <path d="M1575 504 V545 H1545 V622 H1520" class="arrow" marker-end="url(#arrow)" />

  <text x="570" y="235" class="small">目标确认后可开启评价</text>
  <text x="1230" y="235" class="small">上级评价完成后进入审批</text>
  <text x="1445" y="560" class="small">结果发布后员工可查看</text>

  <rect x="485" y="130" width="250" height="74" rx="14" class="warning" />
  <text x="610" y="160" class="note">阶段性反馈仅直属上级</text>
  <text x="610" y="184" class="note">在正式评估开启前填写</text>
  <path d="M610 204 V250" class="arrow-note" marker-end="url(#arrow-amber)" />

  <rect x="270" y="390" width="150" height="64" rx="14" class="warning" />
  <text x="345" y="418" class="note">退回调整时</text>
  <text x="345" y="440" class="note">返回目标编辑</text>
  <path d="M312 390 C280 370, 240 355, 190 334" class="arrow-note" marker-end="url(#arrow-amber)" />

  <rect x="600" y="520" width="260" height="92" rx="16" class="danger" />
  <text x="730" y="555" class="label">不开启 / 终止转正</text>
  <text x="730" y="585" class="label">进入“已结束”</text>

  <path d="M570 334 C590 405, 630 470, 690 520" class="arrow-dashed" marker-end="url(#arrow-red)" />
  <path d="M1000 334 C985 405, 925 470, 790 520" class="arrow-dashed" marker-end="url(#arrow-red)" />
  <text x="610" y="435" class="small">不开启</text>
  <text x="935" y="435" class="small">终止转正</text>

  <rect x="70" y="610" width="130" height="42" rx="12" class="employee" />
  <text x="135" y="632" class="legend">员工动作</text>
  <rect x="220" y="610" width="150" height="42" rx="12" class="manager" />
  <text x="295" y="632" class="legend">直属上级动作</text>
  <rect x="390" y="610" width="120" height="42" rx="12" class="hrbp" />
  <text x="450" y="632" class="legend">HRBP 动作</text>
  <rect x="530" y="610" width="120" height="42" rx="12" class="approval" />
  <text x="590" y="632" class="legend">审批动作</text>
</svg>
